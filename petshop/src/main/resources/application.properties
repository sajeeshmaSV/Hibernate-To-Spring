
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/owner_pet_detatils
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom Messages for Owner Service
owner.already.exists=Owner with ID %s already exists!
owner.not.found=Owner with ID %s not found!

# Message properties (Spring automatically loads messages.properties)
spring.messages.basename=messages